[package]
name = "game_stream"
version = "0.1.0"
edition = "2021"
license = "LGPL-2.1-or-later"
description = "Low-latency Godot viewport streaming and remote input"
readme = "README.md"

[lib]
crate-type = ["cdylib"]

[dependencies]
godot = { version = "0.5.5", features = ["api-4-6", "experimental-threads"] }
ffmpeg-next = { version = "9.0.0", default-features = false, features = ["codec", "format", "software-scaling"] }
