name: Desktop release binaries
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        default: all
        options:
          - all
          - linux-x86_64
          - windows-x86_64
      diagnostics_only:
        description: Inspect cached native dependency configuration logs
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platform == 'all' && '["linux-x86_64","windows-x86_64"]' || format('["{0}"]', inputs.platform)) }}
    runs-on: ${{ matrix.platform == 'windows-x86_64' && 'windows-2022' || 'ubuntu-22.04' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        id: msys2
        with:
          msystem: MSYS
          path-type: inherit
          install: make diffutils pkgconf nasm
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev nasm pkg-config ninja-build libva-dev libdrm-dev libgl1-mesa-dev libx11-dev libxext-dev libxcursor-dev libxi-dev libxfixes-dev libxrandr-dev libxss-dev libxrender-dev libxkbfile-dev libxinerama-dev libxv-dev libxmu-dev libxt-dev libxaw7-dev libxcb-dri3-dev libxcb-dri2-0-dev libxcb-glx0-dev libxcb-present-dev libxcb-sync-dev libxcb-randr0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-xinerama0-dev libxcb-keysyms1-dev libxcb-image0-dev libxcb-render-util0-dev libxcb-icccm4-dev libxcb-util-dev libxcb-cursor-dev
          sudo apt-get install -y libx11-xcb-dev libfontenc-dev libxcomposite-dev libxdamage-dev libxmuu-dev libxres-dev libxtst-dev libxxf86vm-dev libxcb-xkb-dev libxcb-composite0-dev libxcb-ewmh-dev libxcb-res0-dev
      - run: python -m pip install conan==2.28.1 ninja cmake
      - uses: actions/cache/restore@v4
        id: build-cache
        with:
          key: desktop-${{ matrix.platform }}-v1-${{ hashFiles('scripts/desktop_sdk.py', 'clients/mirctl/conanfile.txt', 'clients/mirctl/scripts/build.py', 'native/game_stream/Cargo.lock') }}
          path: |
            ~/.conan2
            build/ffmpeg
            build/desktop-sdk
            build/release-tools
            native/game_stream/target
      - name: Build and validate native binaries
        if: ${{ !inputs.diagnostics_only }}
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
          CONAN_NON_INTERACTIVE: '1'
          GAME_STREAM_REUSE_SDK: ${{ steps.build-cache.outputs.cache-hit }}
        run: python scripts/desktop_release.py
      - name: Inspect cached dependency configuration
        if: inputs.diagnostics_only
        shell: python
        run: |
          from pathlib import Path
          for path in sorted((Path.home() / '.conan2/p/b').glob('ffmpe*/b/**/config.log')):
              print(str(path), flush=True)
              print(path.read_text(errors='replace')[-18000:], flush=True)
          for path in sorted((Path.home() / '.conan2/p/b').glob('ffmpe*/b/**/dav1d.pc')):
              print(str(path), flush=True)
              print(path.read_text(errors='replace'), flush=True)
      - uses: actions/cache/save@v4
        if: always() && steps.build-cache.outputs.cache-primary-key != '' && steps.build-cache.outputs.cache-hit != 'true'
        with:
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
          path: |
            ~/.conan2
            build/ffmpeg
            build/desktop-sdk
            build/release-tools
            native/game_stream/target
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-${{ matrix.platform }}
          if-no-files-found: warn
          path: |
            dist/*
            build/desktop-sdk/ffmpeg-build/ffbuild/config.log
            clients/mirctl/build/conan-graph.json
