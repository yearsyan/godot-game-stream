name: Store package validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libva2 libva-drm2 libdrm2 libgl1 libx11-6 libxcursor1 libxi6 libxrandr2 libxinerama1 libfontconfig1 libasound2
      - name: Validate fresh installation and relocated release export
        run: python scripts/validate_store.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: store-validation-${{ runner.os }}
          path: |
            build/store-validation/*.log
            build/store-validation/result.json
            dist/store/*
  reproducibility:
    needs: export
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: store-validation-*
          path: results
      - name: Compare archives from native Windows and Linux runners
        shell: python
        run: |
          import hashlib
          from pathlib import Path
          archives = list(Path('results').rglob('godot-game-stream-0.1.0-desktop.zip'))
          assert len(archives) == 2, archives
          checksums = {hashlib.sha256(path.read_bytes()).hexdigest() for path in archives}
          assert len(checksums) == 1, checksums
          print('Identical desktop archive on both runners:', checksums.pop())
